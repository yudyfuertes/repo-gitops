apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gestion-acueductos-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yudyfuertes/repo-gitops.git
    targetRevision: HEAD
    path: apps/gestion-acueductos-api
  destination:
    server: https://kubernetes.default.svc
    namespace: gestion-acueductos-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
